name: Build Nanxi Pet APK

on:
  push:
    branches: [main]
    paths:
      - 'nanxi-pet/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: nanxi-pet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanxi-pet-debug
          path: nanxi-pet/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 最新构建
          body: |
            自动构建 · commit ${{ github.sha }}
            下载 `app-debug.apk` 直接安装（需允许安装未知来源应用）。
          prerelease: true
          files: nanxi-pet/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
